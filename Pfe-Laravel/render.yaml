services:
  - type: web
    name: morovista-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: MoroVista
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          type: web
          name: morovista-api
          property: host
      - key: APP_KEY
        sync: false  # ← khassk tzetah b idik f Render dashboard (sirri)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false  # ← sirri - zedha f dashboard
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false  # ← sirri - zedha f dashboard
      - key: DB_USERNAME
        sync: false  # ← sirri - zedha f dashboard
      - key: DB_PASSWORD
        sync: false  # ← sirri - zedha f dashboard
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FRONTEND_URL
        value: https://morovista.vercel.app
